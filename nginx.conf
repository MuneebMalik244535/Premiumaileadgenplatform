events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_ui {
        server frontend:80;
    }

    # HTTP Server: ACME Let's Encrypt Challenge & HTTPS Auto-Redirect
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Let's Encrypt ACME Challenge Validation Path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health Check endpoint on HTTP
        location /healthz {
            proxy_pass http://backend_api/api/healthz;
        }

        # Automatic HTTP -> HTTPS Redirection (Active when SSL certs exist)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: TLS 1.2/1.3 SSL Termination Gateway
    server {
        listen 443 ssl;
        server_name _;

        client_max_body_size 20M;

        # SSL Certificate Paths (Managed by Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;

        # Enterprise SSL Parameters & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Frontend SPA Static Assets & Routes
        location / {
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket Gateway endpoint
        location /api/ws {
            proxy_pass http://backend_api/api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        # Backend REST API Routes
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
