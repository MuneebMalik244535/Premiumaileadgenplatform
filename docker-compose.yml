version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadgen_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadgen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadgen_pass_secure_99}
      POSTGRES_DB: ${POSTGRES_DB:-leadgen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadgen_user} -d ${POSTGRES_DB:-leadgen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadgen_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadgen_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leadgen_user}:${POSTGRES_PASSWORD:-leadgen_pass_secure_99}@postgres:5432/${POSTGRES_DB:-leadgen_db}
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-prod-secret-jwt-token-change-in-env-999}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin@leadgen.pro}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadgen_celery_worker
    restart: always
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leadgen_user}:${POSTGRES_PASSWORD:-leadgen_pass_secure_99}@postgres:5432/${POSTGRES_DB:-leadgen_db}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leadgen_frontend
    restart: always
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    container_name: leadgen_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
